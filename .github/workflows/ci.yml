name: CI

# The deploy webhook on the server listens for this workflow ("CI") finishing green on main.
# Keep the name in sync with DEPLOY_WORKFLOW in /etc/opportuneer/hook.env.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opportuneer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opportuneer?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      SKIP_STARTUP_SCAN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Migrate
        run: npx prisma migrate deploy
      - name: Build
        shell: bash
        run: |
          set +e
          # next/font fetches Google Fonts at build time; retry the occasional network failure
          for attempt in 1 2 3; do
            npm run build 2>&1 | tee build.log
            code=${PIPESTATUS[0]}
            [ "$code" = 0 ] && break
            sleep 10
          done
          if [ "$code" != 0 ]; then tail -25 build.log | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $code
      - name: Tests
        shell: bash
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          set +e
          npm test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          # surface the failures as annotations so they show on the run page
          grep -E "^(✖|\s+Error|\s+AssertionError)|exited early" test.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code
