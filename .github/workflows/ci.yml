name: CI

# CI on every push and pull request. A green push to main then deploys to the server (the deploy job below).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # never cancel a push run: it may be in the middle of deploying
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opportuneer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opportuneer?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      SKIP_STARTUP_SCAN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Migrate
        run: npx prisma migrate deploy
      - name: Build
        shell: bash
        run: |
          set +e
          # next/font fetches Google Fonts at build time; retry the occasional network failure
          for attempt in 1 2 3; do
            npm run build 2>&1 | tee build.log
            code=${PIPESTATUS[0]}
            [ "$code" = 0 ] && break
            sleep 10
          done
          if [ "$code" != 0 ]; then tail -25 build.log | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $code
      - name: Tests
        shell: bash
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          set +e
          npm test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          # surface the failures as annotations so they show on the run page
          grep -E "^(✖|\s+Error|\s+AssertionError)|exited early" test.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code

  deploy:
    # Only a green push to main deploys. Pull requests never do.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then echo "::error::Add the DEPLOY_SSH_KEY repository secret (see DEPLOY.md)"; exit 1; fi
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # the server's public host key, so the connection cannot be intercepted
          echo "62.171.188.211 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDcg+QlY9sxOyYj+NaogRfzMOafEYRCv1p4kpUl0iblF" > ~/.ssh/known_hosts
          # the key can only ask the server to deploy one commit; the server re-checks it is on main and not older than what is live
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 root@62.171.188.211 "${{ github.sha }}"
