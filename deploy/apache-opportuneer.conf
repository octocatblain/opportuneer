# opportuneer.redstarstandard.co.ke -> Next.js on http://127.0.0.1:3040, deploy webhook on http://127.0.0.1:9040
# Installed as /usr/local/apache/conf.d/opportuneer.redstarstandard.co.ke.conf, then: apachectl configtest && systemctl reload httpd
<VirtualHost 62.171.188.211:80>
    ServerName opportuneer.redstarstandard.co.ke

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://opportuneer.redstarstandard.co.ke%{REQUEST_URI} [R=301,L,NE]

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge>
        Require all granted
    </Directory>

    ErrorLog /var/log/httpd/opportuneer-error.log
    CustomLog /var/log/httpd/opportuneer-access.log combined
</VirtualHost>

<VirtualHost 62.171.188.211:443>
    ServerName opportuneer.redstarstandard.co.ke

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/opportuneer.redstarstandard.co.ke/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/opportuneer.redstarstandard.co.ke/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    # AI drafting and scans can take minutes; feedback uploads can be large
    ProxyTimeout 600

    ProxyPass /hooks/deploy http://127.0.0.1:9040/hooks/deploy
    ProxyPassReverse /hooks/deploy http://127.0.0.1:9040/hooks/deploy
    ProxyPass / http://127.0.0.1:3040/
    ProxyPassReverse / http://127.0.0.1:3040/

    ErrorLog /var/log/httpd/opportuneer-ssl-error.log
    CustomLog /var/log/httpd/opportuneer-ssl-access.log combined
</VirtualHost>
